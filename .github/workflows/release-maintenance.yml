name: Release maintenance issue (retired)

on:
  push:
    branches: [test/idweb-harness-e2e]
    paths: [.github/workflows/release-maintenance.yml]
  workflow_dispatch:
    inputs:
      detect_latest:
        description: Discover the latest stable UI package instead of using release inputs
        required: false
        default: false
        type: boolean
      dry_run:
        description: Report the target without creating an issue or assigning Copilot
        required: false
        default: false
        type: boolean
      package:
        description: Exact cataloged IdWeb package identifier (not MSAL)
        required: false
        type: string
      version:
        description: Exact published three-part stable IdWeb package version
        required: false
        type: string
      release_notes_url:
        description: Official IdWeb release URL matching this version
        required: false
        type: string
      event_key:
        description: Optional coordinator deduplication key
        required: false
        type: string
      assign_copilot:
        description: Assign the release issue using a separately configured user token
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-maintenance-test
  cancel-in-progress: false

jobs:
  use-shared-harness:
    if: ${{ github.repository == 'hossnrabbit/active-directory-aspnetcore-webapp-openidconnect-v2' && github.ref == 'refs/heads/test/idweb-harness-e2e' }}
    runs-on: ubuntu-latest
    steps:
      - name: Point to the single shared harness
        run: echo 'This test entry point is retired. Use Release maintenance issue in hossnrabbit/ms-identity-docs-code-dotnet on test/msal-harness-e2e for either MSAL.NET or IdWeb.' >> "$GITHUB_STEP_SUMMARY"
  open-issue:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          ref: test/idweb-harness-e2e
          persist-credentials: false
      - name: Resolve release target
        id: target
        shell: pwsh
        env:
          DISCOVER_LATEST: ${{ github.event_name == 'schedule' || inputs.detect_latest }}
          ASSIGN_COPILOT: ${{ inputs.assign_copilot }}
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_URL: ${{ inputs.release_notes_url }}
          EVENT_KEY: ${{ inputs.event_key }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DISCOVER_LATEST -eq 'true') {
            if ($env:ASSIGN_COPILOT -eq 'true') { throw 'Discovery cannot assign Copilot before setup approval.' }
            if ($env:RELEASE_PACKAGE -or $env:RELEASE_VERSION -or $env:RELEASE_URL -or $env:EVENT_KEY) {
              throw 'Discovery cannot be combined with manual release inputs.'
            }
            $release = ./scripts/Find-MaintenanceRelease.ps1
            "available=$($release.updateAvailable.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "package=$($release.package)" >> $env:GITHUB_OUTPUT
            "version=$($release.version)" >> $env:GITHUB_OUTPUT
            "url=$($release.releaseUrl)" >> $env:GITHUB_OUTPUT
            "Latest stable $($release.package): $($release.version); outdated retained projects: $($release.projects.Count)." >> $env:GITHUB_STEP_SUMMARY
          } else {
            if ($env:RELEASE_PACKAGE -cne 'Microsoft.Identity.Web.UI' -or $env:RELEASE_VERSION -cne '3.8.2' -or
                $env:RELEASE_URL -cne 'https://github.com/AzureAD/microsoft-identity-web/releases/tag/3.8.2') {
              throw 'Manual release must match the approved UI 3.8.2 target.'
            }
            'available=true' >> $env:GITHUB_OUTPUT
            "package=$env:RELEASE_PACKAGE" >> $env:GITHUB_OUTPUT
            "version=$env:RELEASE_VERSION" >> $env:GITHUB_OUTPUT
            "url=$env:RELEASE_URL" >> $env:GITHUB_OUTPUT
          }
      - name: Create or reuse an exact-release issue
        if: ${{ steps.target.outputs.available == 'true' }}
        id: release-issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_PACKAGE: ${{ steps.target.outputs.package }}
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
          RELEASE_URL: ${{ steps.target.outputs.url }}
          EVENT_KEY: ${{ inputs.event_key }}
          DISCOVER_LATEST: ${{ github.event_name == 'schedule' || inputs.detect_latest }}
          DRY_RUN: ${{ inputs.dry_run }}
          APPROVED_PACKAGE: Microsoft.Identity.Web.UI
          APPROVED_VERSION: 3.8.2
        with:
          script: |
            const crypto = require('node:crypto');
            const catalog = require('./scripts/maintenance-samples.json');
            const packageId = process.env.RELEASE_PACKAGE;
            const version = process.env.RELEASE_VERSION;
            if (!catalog.packages.includes(packageId) || !/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error('Only cataloged IdWeb packages and exact stable versions are supported.');
            }
            if (packageId !== process.env.APPROVED_PACKAGE ||
              (process.env.DISCOVER_LATEST !== 'true' && version !== process.env.APPROVED_VERSION)) {
              throw new Error('Dispatch must match the administrator-approved Copilot setup package/version.');
            }
            const expectedUrl = `https://github.com/AzureAD/microsoft-identity-web/releases/tag/${version}`;
            if (process.env.RELEASE_URL !== expectedUrl) {
              throw new Error('Release URL must identify the exact official IdWeb version tag.');
            }
            const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const key = crypto.createHash('sha256')
              .update(`${repository}|${packageId.toLowerCase()}|${version}`).digest('hex');
            if (process.env.EVENT_KEY && process.env.EVENT_KEY !== key) {
              throw new Error('Event key does not match this repository/package/version.');
            }
            const marker = `<!-- sample-maintenance:${key} -->`;
            if (process.env.DRY_RUN === 'true') {
              core.notice(`Dry run: ${packageId} ${version}; event key ${key}; no issue or assignment.`);
              return;
            }
            for await (const page of github.paginate.iterator(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', per_page: 100
            })) {
              const existing = page.data.find(issue => !issue.pull_request &&
                issue.user?.login === 'github-actions[bot]' && issue.body?.includes(marker));
              if (existing) {
                core.setOutput('issue-number', existing.number);
                core.notice(`Release issue already exists: ${existing.html_url}`);
                return;
              }
            }
            const issue = await github.rest.issues.create({
              ...context.repo,
              title: `Evaluate ${packageId} ${version} in retained IdWeb samples`,
              body: [marker,
                `Evaluate direct references to ${packageId} at exact version ${version}.`,
                `Official release: ${expectedUrl}`,
                'Detection is not execution approval. Copilot assignment is off for discovery. A maintainer must approve matching setup and resolve provenance before any source update; otherwise SETUP_BLOCKED. The release tag URL is a candidate until verified by setup.',
                'Follow AGENTS.md and scripts/maintenance-samples.json. Use sample-implementer with actual read-only planner/reviewer role execution.',
                'Require ORIGINAL .maintenance-evidence/manifest.json from setup matching this package/version and each original project baseline. Missing or mismatched evidence is SETUP_BLOCKED; never refetch/regenerate it.',
                'Compare public contracts, implementation, tests and new parameters/defaults/options across both exact IdWeb source revisions. Produce the required scenario-improvement matrix with source/test citations, coverage and candidate dispositions; release notes or compatibility alone are insufficient.',
                'Keep excluded/newer projects, other package references, frameworks, flows, settings and harness files unchanged. Never add MSAL references. Coordinated package migrations require maintainer-approved scope.',
                'Run offline tests and original-manifest validation with -ExpectedVersion ' + version + '. Require hosted builds and independent review; clearly report every NOT RUN/PARTIAL/BLOCKED check. Do not execute SDK code or live authentication.',
                'TEST FORK ONLY: open any maintenance PR in hossnrabbit/active-directory-aspnetcore-webapp-openidconnect-v2 against test/idweb-harness-e2e, never upstream or a cleanup PR. Do not merge, enable auto-merge or alter approval policies.',
                'Human workflow execution approval and human merge approval remain required according to existing policy.'
              ].join('\n\n')
            });
            core.setOutput('issue-number', issue.data.number);
            core.notice(`Created release issue: ${issue.data.html_url}`);
      - name: Optionally assign Copilot
        if: ${{ inputs.assign_copilot && !inputs.detect_latest && !inputs.dry_run && steps.release-issue.outputs.issue-number != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_ISSUE_NUMBER: ${{ steps.release-issue.outputs.issue-number }}
        with:
          github-token: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          script: |
            const assignIssue = require('./.github/scripts/assign-maintenance-issue.cjs');
            await assignIssue({ github, context, core, issueNumber: Number(process.env.RELEASE_ISSUE_NUMBER) });